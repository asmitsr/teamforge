# One-command setup: docker compose up --build
# mongo (replica set via --replSet, so transactions work) + server + client.
# NOTE: replica-set initiation needs a one-time `rs.initiate()` — the server
# retries its connection, and `mongo-init` runs it automatically below.
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval", "try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) } catch(e) { print('init:', e.codeName || e) }"]
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/teamforge?replicaSet=rs0
      JWT_SECRET: change-me-to-a-long-random-string
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  mongo-data:
